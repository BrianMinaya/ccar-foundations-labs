name: Bug report
description: Report a reproducible problem in a lab
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys or confidential exam material."
  - type: input
    id: lab
    attributes:
      label: Lab and milestone
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and observed output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python, dependency, and Claude Code versions
