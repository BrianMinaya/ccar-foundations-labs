# [M6] Headless CI — runs Claude Code in non-interactive mode
#
# EXAM NOTE ────────────────────────────────────────────────────
#   -p / --print is THE fix for "our CI job hangs"
#   Without it, Claude Code opens an interactive session on a machine
#   with no human or TTY → hangs forever.
#
#   Gate on a structured FIELD, never on the model's prose.
#   Independent review = separate `claude -p` with fresh context,
#   so it can't inherit the blind spots of the reasoning that wrote the code.
#
#   Also covers:
#   - Plan mode vs direct execution (triggered by ambiguity/scope, not difficulty)
#   - --continue: resume the most recent session
#   - --resume <name>: resume a specific named session
#   - --fork-session: divergent exploration from shared baseline
#   - Fresh start: when context has gone stale
# ──────────────────────────────────────────────────────────────

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.220

      - name: Run Claude Code Review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          SCHEMA=$(jq -c . .github/claude-review-schema.json)
          # -p makes it non-interactive (THE fix for CI hangs)
          # JSON output is an envelope; --json-schema fills structured_output.
          # --max-turns 5 limits the review scope
          claude -p \
            "Review only the diff from ${{ github.event.pull_request.base.sha }} to ${{ github.event.pull_request.head.sha }} for security issues, bugs, and code quality problems. Do not edit files. Return the requested schema." \
            --output-format json \
            --json-schema "$SCHEMA" \
            --permission-mode plan \
            --allowed-tools "Read,Grep,Glob,Bash(git diff *)" \
            --max-turns 5 \
            --max-budget-usd 1.00 \
            --no-session-persistence \
            > review_envelope.json

          jq -e '.structured_output | type == "object" and (.findings | type == "array")' \
            review_envelope.json >/dev/null
          jq '.structured_output' review_envelope.json > review_output.json

      - name: Check for Critical Findings
        run: |
          set -euo pipefail
          # Gate on a structured field, never on prose
          CRITICAL_COUNT=$(jq '[.findings[] | select(.severity == "critical")] | length' review_output.json)
          HIGH_COUNT=$(jq '[.findings[] | select(.severity == "high")] | length' review_output.json)

          echo "Critical findings: $CRITICAL_COUNT"
          echo "High findings: $HIGH_COUNT"

          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::Found $CRITICAL_COUNT critical security issues"
            exit 1
          fi

          if [ "$HIGH_COUNT" -gt 3 ]; then
            echo "::warning::Found $HIGH_COUNT high-severity issues"
            exit 1
          fi

      - name: Post Review Comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f review_output.json ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --body "## Claude Code Review Results
          $(jq -r 'if (.findings | length) == 0 then "No findings." else .findings[] | "- **\(.severity)**: \(.file):\(.line) - \(.description)" end' review_output.json)"
          fi
